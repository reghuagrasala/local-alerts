<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Local Alerts</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="phone">
  <header class="topbar">
    <div>
      <div class="eyebrow">PUBLIC SAFETY HELPER</div>
      <h1>Local Alerts</h1>
      <p id="location">Thrissur, Kerala</p>
    </div>
    <button id="locBtn" class="icon-btn" title="Use location">⌖</button>
  </header>

  <section class="status-card">
    <div><span class="dot"></span><b>Ready</b><small> Local public alerts</small></div>
    <div id="updated">Prototype</div>
  </section>

  <section class="category-strip" id="homeCategories"></section>

  <section class="content-scroll">
    <h2>Active alerts</h2>
    <div id="activeAlerts" class="stack"></div>

    <h2>Upcoming / tomorrow</h2>
    <div id="upcomingAlerts" class="stack"></div>

    <h2 class="muted-heading">Inactive</h2>
    <div id="inactiveAlerts" class="stack"></div>
  </section>

  <nav class="bottom-nav">
    <button class="nav active" data-page="home">⌂<span>Home</span></button>
    <button class="nav" data-page="alerts">⚠<span>Alerts</span></button>
    <button class="nav" data-page="report">☎<span>Report to</span></button>
  </nav>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
