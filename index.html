<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b63ce">
<meta name="description" content="Independent public-help resource for local alerts and reporting contacts.">
<meta property="og:title" content="Local Alerts">
<meta property="og:description" content="Independent public-help resource for local alerts and reporting contacts.">
<meta property="og:image" content="share.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Local Alerts</title>
<style>
.sachet-top{padding:8px 16px 10px;background:rgba(255,255,255,.42);border-top:1px solid rgba(120,160,205,.18);border-bottom:1px solid rgba(120,160,205,.18)}
.sachet-top-head{font-weight:800;color:#123b69;font-size:15px;margin-bottom:6px}
.sachet-top-actions{display:flex;gap:8px;overflow:hidden;margin-top:7px}
.sachet-top-actions a{flex:1;min-width:0;text-align:center;text-decoration:none;padding:7px 6px;border-radius:11px;background:rgba(225,239,255,.78);border:1px solid rgba(80,145,210,.35);color:#145b9e;font-weight:700;font-size:12px;white-space:nowrap}
.sachet-top-status{font-size:11px;color:#64748b;margin-top:5px}
.sachet-top-alerts{font-size:12px;color:#243b53;max-height:88px;overflow:auto;margin-top:6px}
.sachet-top-alerts ul{margin:4px 0 0;padding-left:18px}
.sachet-top-alerts li{margin:4px 0}
.sachet-top-alerts a{color:#145b9e;font-weight:700}
</style>
</head>
<body>
<main class="app">
  <header id="homeHeader" class="topbar">
    <div class="title-wrap">
      <div class="eyebrow">PUBLIC SAFETY HELPER</div>
      <h1>Local Alerts</h1>
      <p id="location">Location not available</p>
      <p id="datetime" class="datetime">--</p>
    </div>
    <button id="locBtn" class="location-btn" aria-label="Get GPS location">⌖</button>
  </header>

  <section id="statusButtons" class="status-buttons">
    <button id="gpsStatus" class="status gps-off">GPS Off</button>
    <button id="dataStatus" class="status data-off">Data Off</button>
  </section>

  <section id="sachetTop" class="sachet-top">
    <div class="sachet-top-head">NDMA SACHET · CURRENT LOCATION</div>
    <div id="sachetTopStatus" class="sachet-top-status">Waiting for current GPS location…</div>
    <div id="sachetTopAlerts" class="sachet-top-alerts">Location-specific official alerts will appear here automatically.</div>
    <div class="sachet-top-actions">
      <a target="_blank" rel="noopener noreferrer" href="https://sachet.ndma.gov.in/">Official SACHET</a>
      <a target="_blank" rel="noopener noreferrer" href="https://sachet.ndma.gov.in/CapFeed">SACHET RSS</a>
    </div>
  </section>

  <section id="categoryStrip" class="category-strip"></section>
  <section id="content" class="content-scroll"></section>

  <nav class="bottom-nav">
    <button class="nav active" data-page="home">⌂<span>Home</span></button>
    <button class="nav" data-page="alerts">⚠<span>Alerts</span></button>
    <button class="nav" data-page="report">☎<span>Report to</span></button>
  </nav>
</main>
<script src="data.js"></script>
<script src="public-contacts.js"></script>
<script src="app.js"></script>
<script src="sachet.js"></script>
<script src="gps-fix.js"></script>
</body>
</html>
